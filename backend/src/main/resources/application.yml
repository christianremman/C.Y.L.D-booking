spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: cyld-booking
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: ${PORT:8080}

booking:
  mail:
    from: ${MAIL_FROM:}
    recipient: ${BOOKING_RECIPIENT:}
