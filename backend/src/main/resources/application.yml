spring:
  application:
    name: cyld-booking
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  web:
    resources:
      static-locations: classpath:/static/

booking:
  mail:
    from: ${MAIL_FROM:}
    recipient: ${BOOKING_RECIPIENT:}
