spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: cyld-booking
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  web:
    resources:
      static-locations: classpath:/static/

booking:
  mail:
    from: ${MAIL_FROM:}
    recipient: ${BOOKING_RECIPIENT:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:}
  rate-limit:
    max-requests: ${BOOKING_RATE_LIMIT_MAX_REQUESTS:5}
    window: ${BOOKING_RATE_LIMIT_WINDOW:PT1M}

turnstile:
  secret: ${TURNSTILE_SECRET:}
  verify-url: ${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
